
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Placar Copa Rei do Éden</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
}

:root {
  --gold: #d8b35a;
  --black: #111111;
  --red: #e53935;
}

#scoreboard {
  position: absolute;
  top: 35px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: stretch;
  filter: drop-shadow(0 4px 8px #0008);
}

.team {
  background: rgba(15,15,15,.96);
  border-top: 3px solid var(--gold);
  min-width: 190px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  font-weight: bold;
}

.score {
  background: var(--gold);
  color: #111;
  min-width: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 900;
}

.clockbox {
  background: #191919;
  border-top: 3px solid var(--gold);
  min-width: 105px;
  padding: 7px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#clock {
  font-size: 24px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

#period {
  color: var(--gold);
  font-size: 10px;
  font-weight: bold;
  margin-top: 3px;
}

#brand {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 3px;
  white-space: nowrap;
}

#live {
  position: absolute;
  top: 38px;
  right: 25px;
  background: var(--red);
  padding: 7px 10px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: bold;
}

#goal {
  display: none;
  position: absolute;
  top: 130px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gold);
  color: #111;
  border: 3px solid #111;
  padding: 12px 35px;
  font-size: 38px;
  font-weight: 900;
  font-style: italic;
}

#controls {
  position: absolute;
  left: 20px;
  bottom: 20px;
  width: 290px;
  padding: 14px;
  background: rgba(15,15,15,.97);
  border: 1px solid var(--gold);
  border-radius: 8px;
  font-size: 13px;
}

h3 {
  color: var(--gold);
  margin: 0 0 10px;
}

label {
  display: block;
  margin-top: 8px;
  margin-bottom: 4px;
}

input, select {
  width: 100%;
  padding: 7px;
  background: #292929;
  color: white;
  border: 1px solid #666;
  border-radius: 4px;
}

.buttons {
  display: flex;
  gap: 5px;
  margin-top: 8px;
}

button {
  flex: 1;
  padding: 8px 5px;
  background: var(--gold);
  color: #111;
  border: 0;
  border-radius: 4px;
  font-weight: bold;
  cursor: pointer;
}

button.dark {
  background: #333;
  color: white;
}

.hidden #controls {
  display: none;
}
</style>
</head>

<body>

<div id="brand">COPA REI DO ÉDEN</div>
<div id="live">● AO VIVO</div>

<div id="scoreboard">
  <div class="team" id="teamA">TIME A</div>
  <div class="score" id="scoreA">0</div>

  <div class="clockbox">
    <div id="clock">20:00</div>
    <div id="period">1º TEMPO</div>
  </div>

  <div class="score" id="scoreB">0</div>
  <div class="team" id="teamB">TIME B</div>
</div>

<div id="goal">GOOOOL!</div>

<div id="controls">
  <h3>CONTROLE DO PLACAR</h3>

  <label>Nome do time A</label>
  <input id="inputA" value="TIME A">

  <label>Nome do time B</label>
  <input id="inputB" value="TIME B">

  <button onclick="updateNames()">Atualizar nomes</button>

  <div class="buttons">
    <button onclick="changeScore('A',1)">+ Gol A</button>
    <button class="dark" onclick="changeScore('A',-1)">− Gol A</button>
  </div>

  <div class="buttons">
    <button onclick="changeScore('B',1)">+ Gol B</button>
    <button class="dark" onclick="changeScore('B',-1)">− Gol B</button>
  </div>

  <label>Período da partida</label>
  <select id="periodSelect" onchange="updatePeriod()">
    <option>1º TEMPO</option>
    <option>INTERVALO</option>
    <option>2º TEMPO</option>
    <option>FIM DE JOGO</option>
  </select>

  <div class="buttons">
    <button onclick="startClock()">Iniciar</button>
    <button class="dark" onclick="pauseClock()">Pausar</button>
  </div>

  <div class="buttons">
    <button class="dark" onclick="resetClock()">Resetar 20:00</button>
    <button onclick="toggleGoal()">GOL!</button>
  </div>

  <div class="buttons">
    <button class="dark" onclick="toggleControls()">Ocultar controles</button>
  </div>
</div>

<script>
let scoreA = 0;
let scoreB = 0;
let remaining = 20 * 60;
let clockTimer = null;
let goalTimer = null;

function updateNames() {
  document.getElementById("teamA").textContent =
    document.getElementById("inputA").value.trim().toUpperCase() || "TIME A";

  document.getElementById("teamB").textContent =
    document.getElementById("inputB").value.trim().toUpperCase() || "TIME B";
}

function changeScore(team, amount) {
  if (team === "A") {
    scoreA = Math.max(0, scoreA + amount);
    document.getElementById("scoreA").textContent = scoreA;
  } else {
    scoreB = Math.max(0, scoreB + amount);
    document.getElementById("scoreB").textContent = scoreB;
  }
}

function renderClock() {
  const minutes = Math.floor(remaining / 60);
  const seconds = remaining % 60;

  document.getElementById("clock").textContent =
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");
}

function startClock() {
  if (clockTimer !== null) return;

  clockTimer = setInterval(() => {
    if (remaining > 0) {
      remaining--;
      renderClock();
    } else {
      pauseClock();
    }
  }, 1000);
}

function pauseClock() {
  clearInterval(clockTimer);
  clockTimer = null;
}

function resetClock() {
  pauseClock();
  remaining = 20 * 60;
  renderClock();
}

function updatePeriod() {
  document.getElementById("period").textContent =
    document.getElementById("periodSelect").value;
}

function toggleGoal() {
  const goal = document.getElementById("goal");

  if (goal.style.display === "block") {
    goal.style.display = "none";
    clearTimeout(goalTimer);
  } else {
    goal.style.display = "block";
    clearTimeout(goalTimer);
    goalTimer = setTimeout(() => {
      goal.style.display = "none";
    }, 5000);
  }
}

function toggleControls() {
  document.body.classList.toggle("hidden");
}
</script>

</body>
</html>
